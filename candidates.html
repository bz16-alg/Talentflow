<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow — Candidats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="candidates">
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><i class="fa-solid fa-bolt"></i><span data-i18n="splash.title">TalentFlow</span></div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" data-page="recruiter-dashboard" href="recruiter-dashboard.html"><i class="fa-solid fa-chart-pie"></i><span data-i18n="nav.dashboard">Tableau de bord</span></a>
      <a class="sidebar-link" data-page="create-job" href="create-job.html"><i class="fa-solid fa-briefcase"></i><span data-i18n="nav.offers">Offres</span></a>
      <a class="sidebar-link" data-page="candidates" href="candidates.html"><i class="fa-solid fa-users"></i><span data-i18n="nav.candidates">Candidats</span></a>
      <a class="sidebar-link" data-page="ai-screening" href="ai-screening.html"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="nav.aiScreening">Présélection IA</span></a>
      <a class="sidebar-link" data-page="interviews" href="interviews.html"><i class="fa-solid fa-calendar-check"></i><span data-i18n="nav.interviews">Entretiens</span></a>
      <a class="sidebar-link" data-page="final-decision" href="final-decision.html"><i class="fa-solid fa-gavel"></i><span data-i18n="nav.decisions">Décisions</span></a>
      <a class="sidebar-link" data-page="job-offer" href="job-offer.html"><i class="fa-solid fa-file-signature"></i><span data-i18n="nav.offerLetters">Lettres d'offre</span></a>
      <a class="sidebar-link" data-page="onboarding" href="onboarding.html"><i class="fa-solid fa-rocket"></i><span data-i18n="nav.onboarding">Intégration</span></a>
      <a class="sidebar-link admin-only" data-page="admin-users" href="admin-users.html"><i class="fa-solid fa-user-shield"></i><span data-i18n="nav.admin">Administration</span></a>
    </nav>
    <div class="sidebar-footer">
      <span class="avatar" data-avatar>?</span>
      <div class="sidebar-user">
        <div class="sidebar-user-name" data-user-name>—</div>
        <div class="sidebar-user-role" data-user-role>—</div>
      </div>
      <button type="button" class="sidebar-logout" data-logout title="Déconnexion"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </aside>
  <div class="sidebar-overlay"></div>
  <main class="main">
    <header class="topbar">
      <div class="flex" style="gap:12px;align-items:center">
        <button type="button" class="btn btn-icon btn-outline" data-sidebar-toggle aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <span class="topbar-title" data-topbar-name>—</span>
      </div>
      <div class="topbar-actions">
        <select class="select lang-switch" id="lang-switch"></select>
      </div>
    </header>
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title" data-i18n="candidates.title">Candidats</h1>
          <p class="page-subtitle" data-i18n="candidates.subtitle">Toutes les candidatures reçues</p>
        </div>
        <div class="flex" style="gap:10px">
          <button type="button" class="btn btn-outline" id="btn-export"><i class="fa-solid fa-file-csv"></i> <span data-i18n="common.export">Exporter</span></button>
          <button type="button" class="btn btn-primary" id="btn-add"><i class="fa-solid fa-user-plus"></i> <span data-i18n="candidates.add">Ajouter un candidat</span></button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="form-group" style="min-width:200px">
          <label class="form-label" for="f-offer" data-i18n="offer.title">Offre</label>
          <select class="select" id="f-offer"></select>
        </div>
        <div class="form-group" style="min-width:160px">
          <label class="form-label" for="f-source" data-i18n="candidates.source">Source</label>
          <select class="select" id="f-source"></select>
        </div>
        <div class="form-group" style="min-width:160px">
          <label class="form-label" for="f-status" data-i18n="common.status">Statut</label>
          <select class="select" id="f-status"></select>
        </div>
        <div class="form-group" style="min-width:140px">
          <label class="form-label" for="f-date-from" data-i18n="common.from">De</label>
          <input type="date" class="input" id="f-date-from">
        </div>
        <div class="form-group" style="min-width:140px">
          <label class="form-label" for="f-date-to" data-i18n="common.to">À</label>
          <input type="date" class="input" id="f-date-to">
        </div>
        <div class="form-group search-box" style="flex:1;min-width:200px">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" class="input search-input" id="f-search" data-i18n-placeholder="candidates.searchPlaceholder" placeholder="Rechercher un candidat…">
        </div>
        <button type="button" class="btn btn-outline" id="btn-reset" data-i18n="common.reset">Réinitialiser</button>
      </div>

      <div class="stats-grid" id="stats-grid"></div>

      <div id="table-container"></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/ai.js"></script>
<script src="js/widgets.js"></script>
<script src="js/script.js"></script>
<script>
(function () {
  'use strict';
  var esc = Widgets.escapeHTML;
  var state = { applications: [], offers: [], filters: { offer: '', source: '', status: '', from: '', to: '', search: '' } };
  var tableContainer = document.getElementById('table-container');

  function platformInfo(row) {
    var src = (row.candidates && row.candidates.source) || row.source || '';
    var p = CONFIG.PLATFORMS[src];
    return { key: src, name: p ? p.name : (src || ''), color: p ? p.color : '#64748b' };
  }

  function scoreCell(score) {
    var n = Number(score) || 0;
    var cls = n >= 80 ? 'score-high' : n >= 60 ? 'score-mid' : 'score-low';
    var bar = n >= 80 ? 'green' : n >= 60 ? 'orange' : 'red';
    return '<div style="display:flex;align-items:center;gap:10px;min-width:120px">' +
      '<span class="score ' + cls + '">' + n + '</span>' +
      '<div class="progress" style="flex:1;min-width:50px"><div class="progress-bar ' + bar + '" style="width:' + n + '%"></div></div></div>';
  }

  function clusterBadge(cluster) {
    if (!cluster) return '<span class="text-muted">—</span>';
    var map = { A: ['green', 'A'], B: ['orange', 'B'], C: ['red', 'C'] };
    var m = map[cluster] || ['gray', cluster];
    return '<span class="badge badge-' + m[0] + '">' + esc(m[1]) + '</span>';
  }

  function candidateCell(row) {
    var c = row.candidates || {};
    return '<div class="flex" style="gap:10px;align-items:center">' + Widgets.avatar(c.full_name) +
      '<div><div class="fw-700">' + esc(c.full_name || '—') + '</div>' +
      '<div class="text-muted" style="font-size:12px">' + esc(c.email || '') + '</div></div></div>';
  }

  function actionsCell(row) {
    return '<div class="actions">' +
      '<button type="button" class="btn btn-icon btn-outline btn-sm" data-action="view" data-id="' + row.id + '" title="' + esc(t('common.view')) + '"><i class="fa-solid fa-eye"></i></button>' +
      '<button type="button" class="btn btn-icon btn-outline btn-sm" data-action="edit" data-id="' + row.id + '" title="' + esc(t('common.edit')) + '"><i class="fa-solid fa-pen"></i></button>' +
      '<button type="button" class="btn btn-icon btn-outline btn-sm btn-danger" data-action="delete" data-id="' + row.id + '" title="' + esc(t('common.delete')) + '"><i class="fa-solid fa-trash"></i></button>' +
      '</div>';
  }

  function renderTable() {
    var rows = state.applications;
    Widgets.renderTable(tableContainer, {
      columns: [
        { label: t('common.name'), render: candidateCell },
        { label: t('candidates.city'), render: function (row) { return esc((row.candidates && row.candidates.city) || '—'); } },
        { label: t('candidates.source'), render: function (row) { var p = platformInfo(row); return p.key ? '<span class="badge" style="background:' + p.color + '1a;color:' + p.color + '">' + esc(p.name) + '</span>' : '<span class="text-muted">—</span>'; } },
        { label: t('offer.title'), render: function (row) { return esc((row.job_offers && row.job_offers.title) || '—'); } },
        { label: t('candidates.score'), render: function (row) { return scoreCell(row.match_score); } },
        { label: t('candidates.cluster'), render: function (row) { return clusterBadge(row.ai_cluster); } },
        { label: t('common.status'), render: function (row) { return Widgets.badge(row.status || 'new'); } },
        { label: t('common.date'), render: function (row) { return Widgets.formatDate(row.created_at); } },
        { label: t('common.actions'), render: actionsCell }
      ],
      rows: rows,
      emptyText: t('candidates.noCandidates')
    });
  }

  function renderStats() {
    var rows = state.applications;
    var count = function (s) { return rows.filter(function (a) { return a.status === s; }).length; };
    document.getElementById('stats-grid').innerHTML =
      Widgets.statCard({ icon: 'fa-users', color: 'blue', value: rows.length, label: t('candidates.title') }) +
      Widgets.statCard({ icon: 'fa-user-plus', color: 'blue', value: count('new'), label: t('candidates.statusNew') }) +
      Widgets.statCard({ icon: 'fa-magnifying-glass', color: 'orange', value: count('screened'), label: t('candidates.statusScreened') }) +
      Widgets.statCard({ icon: 'fa-calendar-check', color: 'purple', value: count('interview'), label: t('candidates.statusInterview') });
  }

  async function loadApplications() {
    var f = state.filters;
    try {
      var data = await DB.getApplications({
        job_offer_id: f.offer || undefined,
        status: f.status || undefined,
        source: f.source || undefined,
        search: f.search || undefined
      });
      if (f.from) data = data.filter(function (a) { return String(a.created_at || '').slice(0, 10) >= f.from; });
      if (f.to) data = data.filter(function (a) { return String(a.created_at || '').slice(0, 10) <= f.to; });
      state.applications = data;
      renderStats();
      renderTable();
    } catch (e) {
      Widgets.toast(getErrorMessage(e), 'error');
    }
  }

  function customModal(title, bodyHTML, opts) {
    opts = opts || {};
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var modalEl = document.createElement('div');
    modalEl.className = 'modal';
    var header = document.createElement('div');
    header.className = 'modal-header';
    var h = document.createElement('h3');
    h.textContent = title;
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn btn-icon btn-outline modal-close';
    closeBtn.setAttribute('aria-label', 'Fermer');
    closeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
    header.append(h, closeBtn);
    var body = document.createElement('div');
    body.className = 'modal-body';
    body.innerHTML = bodyHTML;
    modalEl.append(header, body);
    if (opts.footerHTML) {
      var footer = document.createElement('div');
      footer.className = 'modal-footer';
      footer.innerHTML = opts.footerHTML;
      modalEl.appendChild(footer);
    }
    overlay.appendChild(modalEl);
    document.body.appendChild(overlay);
    var close = function () { overlay.remove(); document.removeEventListener('keydown', onKey); };
    var onKey = function (e) { if (e.key === 'Escape') close(); };
    closeBtn.addEventListener('click', close);
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKey);
    return { overlay: overlay, body: body, close: close };
  }

  function formGroup(label, inner) {
    return '<div class="form-group"><label class="form-label">' + label + '</label>' + inner + '</div>';
  }

  function sourceOptions(selected) {
    var out = '<option value="manual"' + (selected === 'manual' || !selected ? ' selected' : '') + '>' + esc(t('candidates.manualAdd')) + '</option>';
    Object.keys(CONFIG.PLATFORMS).forEach(function (k) {
      out += '<option value="' + k + '"' + (selected === k ? ' selected' : '') + '>' + esc(CONFIG.PLATFORMS[k].name) + '</option>';
    });
    return out;
  }

  function openCandidateModal(app) {
    var c = app ? (app.candidates || {}) : {};
    var isEdit = !!app;
    var html =
      '<div class="grid-2">' +
      formGroup(t('common.name') + ' <span class="required">*</span>', '<input class="input" id="cf-name" value="' + esc(c.full_name || '') + '">') +
      formGroup(t('common.email') + ' <span class="required">*</span>', '<input type="email" class="input" id="cf-email" value="' + esc(c.email || '') + '">') +
      formGroup(t('candidates.phone'), '<input class="input" id="cf-phone" value="' + esc(c.phone || '') + '">') +
      formGroup(t('candidates.city'), '<input class="input" id="cf-city" value="' + esc(c.city || '') + '">') +
      formGroup(t('candidates.source'), '<select class="select" id="cf-source">' + sourceOptions(c.source) + '</select>') +
      formGroup(t('candidates.linkedinUrl'), '<input class="input" id="cf-linkedin" value="' + esc(c.linkedin_url || '') + '">') +
      '</div>' +
      formGroup(t('candidates.coverLetter'), '<textarea class="textarea" id="cf-cover">' + esc(c.cover_letter || '') + '</textarea>') +
      formGroup(t('candidates.cv'),
        '<div class="dropzone" id="cf-dropzone"><i class="fa-solid fa-cloud-arrow-up"></i><p>' + esc(t('common.clickToUpload')) + '</p>' +
        '<p class="dropzone-hint">' + esc(t('common.dragDrop')) + '</p><input type="file" id="cf-cv" accept=".pdf,.doc,.docx" hidden></div>');

    var m = customModal(isEdit ? t('candidates.edit') : t('candidates.add'), html, {
      footerHTML: '<button type="button" class="btn btn-outline" data-close>' + esc(t('common.cancel')) + '</button>' +
        '<button type="button" class="btn btn-primary" id="btn-save">' + esc(t('common.save')) + '</button>'
    });

    var file = null;
    var dz = m.body.querySelector('#cf-dropzone');
    var input = m.body.querySelector('#cf-cv');
    var hint = dz.querySelector('.dropzone-hint');
    dz.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      file = input.files && input.files[0] ? input.files[0] : null;
      hint.textContent = file ? file.name : t('common.dragDrop');
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
    });
    dz.addEventListener('drop', function (e) {
      file = e.dataTransfer.files && e.dataTransfer.files[0] ? e.dataTransfer.files[0] : null;
      hint.textContent = file ? file.name : t('common.dragDrop');
    });

    m.overlay.querySelector('[data-close]').addEventListener('click', m.close);
    m.overlay.querySelector('#btn-save').addEventListener('click', async function () {
      var name = m.body.querySelector('#cf-name').value.trim();
      var email = m.body.querySelector('#cf-email').value.trim();
      if (!name || !email) {
        Widgets.toast(t('common.required'), 'error');
        return;
      }
      var btn = m.overlay.querySelector('#btn-save');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + esc(t('common.loading'));
      try {
        var data = {
          full_name: name,
          email: email,
          phone: m.body.querySelector('#cf-phone').value.trim(),
          city: m.body.querySelector('#cf-city').value.trim(),
          source: m.body.querySelector('#cf-source').value,
          linkedin_url: m.body.querySelector('#cf-linkedin').value.trim(),
          cover_letter: m.body.querySelector('#cf-cover').value.trim()
        };
        var candidate = isEdit ? await DB.updateCandidate(c.id, data) : await DB.createCandidate(data);
        if (file) await AI.upsertCv(candidate.id, file);
        Widgets.toast(t('toasts.saved'), 'success');
        m.close();
        await loadApplications();
      } catch (e) {
        Widgets.toast(getErrorMessage(e), 'error');
        btn.disabled = false;
        btn.textContent = t('common.save');
      }
    });
  }

  function openCvModal(url) {
    var m = customModal(t('candidates.viewCv'), '<div id="pdf-box"></div>');
    Widgets.initPDFViewer(m.body.querySelector('#pdf-box'), url);
  }

  function openViewModal(row) {
    var c = row.candidates || {};
    var j = row.job_offers || {};
    var html =
      '<div class="flex" style="gap:12px;align-items:center;margin-bottom:14px">' + Widgets.avatar(c.full_name, 'avatar-lg') +
      '<div><div class="fw-700">' + esc(c.full_name || '—') + '</div><div class="text-muted" style="font-size:12px">' + esc(c.email || '') + '</div></div></div>' +
      '<div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px">' + esc(t('candidates.contact')) + '</div>' +
      '<div class="grid-2" style="margin-bottom:14px">' +
      formGroup(t('common.email'), '<div class="text-muted" style="font-size:13px">' + esc(c.email || '—') + '</div>') +
      formGroup(t('candidates.phone'), '<div class="text-muted" style="font-size:13px">' + esc(c.phone || '—') + '</div>') +
      formGroup(t('candidates.city'), '<div class="text-muted" style="font-size:13px">' + esc(c.city || '—') + '</div>') +
      formGroup(t('offer.title'), '<div class="text-muted" style="font-size:13px">' + esc(j.title || '—') + '</div>') +
      '</div>';
    if (c.linkedin_url) {
      html += '<div class="form-group"><a class="btn btn-outline btn-sm" href="' + esc(c.linkedin_url) + '" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i> ' + esc(t('candidates.linkedin')) + '</a></div>';
    }
    if (c.cover_letter) {
      html += '<div class="form-group"><label class="form-label">' + esc(t('candidates.coverLetter')) + '</label>' +
        '<div class="card card-body" style="white-space:pre-wrap;max-height:160px;overflow:auto;font-size:13px">' + esc(c.cover_letter) + '</div></div>';
    }
    var m = customModal(t('candidates.details'), html);
    if (c.cv_url) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-primary';
      btn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> ' + esc(t('candidates.viewCv'));
      btn.addEventListener('click', function () { openCvModal(c.cv_url); });
      m.body.appendChild(btn);
    }
    DB.getCandidate(c.id).then(function (cand) {
      var apps = (cand && cand.applications) || [];
      var list = '<div class="form-group" style="margin-top:14px"><label class="form-label">' + esc(t('offer.applications')) + '</label>';
      if (!apps.length) {
        list += '<p class="text-muted" style="font-size:13px">—</p>';
      } else {
        list += apps.map(function (a) {
          return '<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">' +
            '<span>' + esc((a.job_offers && a.job_offers.title) || '—') + '</span>' +
            '<span class="flex" style="gap:8px;align-items:center">' + Widgets.badge(a.status || 'new') + '<span class="text-muted">' + Widgets.formatDate(a.created_at) + '</span></span></div>';
        }).join('');
      }
      list += '</div>';
      m.body.insertAdjacentHTML('beforeend', list);
    }).catch(function () {});
  }

  async function deleteApplication(row) {
    var ok = await Widgets.confirm(t('candidates.deleteConfirm'), t('common.delete'));
    if (!ok) return;
    try {
      await Auth.supabase.from('applications').delete().eq('id', row.id);
      Widgets.toast(t('toasts.deleted'), 'success');
      await loadApplications();
    } catch (e) {
      Widgets.toast(getErrorMessage(e), 'error');
    }
  }

  tableContainer.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var row = state.applications.find(function (a) { return a.id === btn.getAttribute('data-id'); });
    if (!row) return;
    var act = btn.getAttribute('data-action');
    if (act === 'view') openViewModal(row);
    else if (act === 'edit') openCandidateModal(row);
    else if (act === 'delete') deleteApplication(row);
  });

  function exportCSV() {
    var header = ['Candidat', 'Email', 'Ville', 'Source', 'Offre', 'Score', 'Cluster', 'Statut', 'Date'];
    var lines = state.applications.map(function (a) {
      return [
        (a.candidates && a.candidates.full_name) || '',
        (a.candidates && a.candidates.email) || '',
        (a.candidates && a.candidates.city) || '',
        platformInfo(a).name,
        (a.job_offers && a.job_offers.title) || '',
        a.match_score == null ? '' : a.match_score,
        a.ai_cluster || '',
        a.status || '',
        String(a.created_at || '').slice(0, 10)
      ];
    });
    var csv = '\uFEFF' + [header].concat(lines).map(function (r) {
      return r.map(function (v) {
        v = String(v == null ? '' : v);
        return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(';');
    }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'candidats.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 100);
  }

  function populateFilters() {
    var offerSel = document.getElementById('f-offer');
    var sourceSel = document.getElementById('f-source');
    var statusSel = document.getElementById('f-status');
    var opts = '<option value="">' + esc(t('common.allOffers')) + '</option>' +
      state.offers.map(function (o) { return '<option value="' + o.id + '">' + esc(o.title) + '</option>'; }).join('');
    offerSel.innerHTML = opts;
    var sources = '<option value="">' + esc(t('common.allSources')) + '</option>';
    Object.keys(CONFIG.PLATFORMS).forEach(function (k) {
      sources += '<option value="' + k + '">' + esc(CONFIG.PLATFORMS[k].name) + '</option>';
    });
    sourceSel.innerHTML = sources;
    var statuses = '<option value="">' + esc(t('common.allStatuses')) + '</option>' + [
      ['new', t('candidates.statusNew')], ['screened', t('candidates.statusScreened')], ['interview', t('candidates.statusInterview')],
      ['rejected', t('candidates.statusRejected')], ['offered', t('candidates.statusOffered')], ['hired', t('candidates.statusHired')]
    ].map(function (s) { return '<option value="' + s[0] + '">' + esc(s[1]) + '</option>'; }).join('');
    statusSel.innerHTML = statuses;
  }

  async function init() {
    try {
      var profile = await Auth.requireAuth(['recruiter', 'manager']);
      if (!profile) return;
      if (window.initSharedLayout) window.initSharedLayout(profile);
      state.offers = await DB.getJobOffers({});
      populateFilters();
      await loadApplications();
    } catch (e) {
      Widgets.toast(getErrorMessage(e), 'error');
    }
  }

  document.getElementById('btn-add').addEventListener('click', function () { openCandidateModal(null); });
  document.getElementById('btn-export').addEventListener('click', exportCSV);
  document.getElementById('btn-reset').addEventListener('click', function () {
    state.filters = { offer: '', source: '', status: '', from: '', to: '', search: '' };
    document.getElementById('f-offer').value = '';
    document.getElementById('f-source').value = '';
    document.getElementById('f-status').value = '';
    document.getElementById('f-date-from').value = '';
    document.getElementById('f-date-to').value = '';
    document.getElementById('f-search').value = '';
    loadApplications();
  });
  document.getElementById('f-offer').addEventListener('change', function (e) { state.filters.offer = e.target.value; loadApplications(); });
  document.getElementById('f-source').addEventListener('change', function (e) { state.filters.source = e.target.value; loadApplications(); });
  document.getElementById('f-status').addEventListener('change', function (e) { state.filters.status = e.target.value; loadApplications(); });
  document.getElementById('f-date-from').addEventListener('change', function (e) { state.filters.from = e.target.value; loadApplications(); });
  document.getElementById('f-date-to').addEventListener('change', function (e) { state.filters.to = e.target.value; loadApplications(); });
  document.getElementById('f-search').addEventListener('input', Widgets.debounce(function (e) {
    state.filters.search = e.target.value.trim();
    loadApplications();
  }, 300));

  init();
})();
</script>
</body>
</html>
