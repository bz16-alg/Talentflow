<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-switch {
  color: var(--primary);
  font-weight: 600;
  cursor: pointer;
}
.auth-switch:hover {
  text-decoration: underline;
}
.password-wrap {
  position: relative;
}
.password-wrap .input {
  padding-right: 42px;
}
.password-toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  font-size: 15px;
  cursor: pointer;
  padding: 4px;
}
.password-toggle:hover {
  color: var(--primary);
}
.auth-card-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}
</style>
</head>
<body data-page="login">

<div class="auth-page">

  <div class="auth-left">
    <canvas id="liquid-ink-canvas"></canvas>
    <div class="flex flex-between w-100" style="margin-bottom:40px">
      <div class="auth-logo" style="margin-bottom:0">
        <i class="fa-solid fa-user-tie"></i><span>TalentFlow</span>
      </div>
    </div>

    <h1>TalentFlow</h1>
    <p data-i18n="auth.loginSubtitle"></p>

    <ul>
      <li><i class="fa-solid fa-list-check"></i> Les 7 étapes du recrutement, maîtrisées de bout en bout</li>
      <li><i class="fa-solid fa-robot"></i> Présélection intelligente des candidats par IA</li>
      <li><i class="fa-solid fa-globe"></i> Diffusion sur les plateformes algériennes d'emploi</li>
    </ul>
  </div>

  <div class="auth-right">
    <div class="flex w-100" style="justify-content:flex-end;margin-bottom:4px">
      <select class="lang-switch" id="lang-switch" data-lang-switch></select>
    </div>

    <div class="auth-logo">
      <i class="fa-solid fa-user-tie"></i><span>TalentFlow</span>
    </div>

    <div class="signin-card">
      <h2 class="auth-card-title" id="card-title" data-i18n="auth.loginTitle"></h2>
      <p class="page-subtitle text-muted" id="card-subtitle" data-i18n="auth.loginSubtitle"></p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="login" data-i18n="auth.login"></button>
        <button type="button" class="tab" data-tab="register" data-i18n="auth.registerTitle"></button>
      </div>

      <div id="panel-login">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email" data-i18n="auth.email"></label>
            <div class="input-icon">
              <i class="fa-solid fa-envelope"></i>
              <input class="input" id="login-email" type="email" autocomplete="email" data-i18n-placeholder="auth.email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password" data-i18n="auth.password"></label>
            <div class="password-wrap">
              <i class="fa-solid fa-lock"></i>
              <input class="input" id="login-password" type="password" autocomplete="current-password" data-i18n-placeholder="auth.password">
              <button type="button" class="password-toggle" data-toggle-password="login-password" aria-label="Afficher le mot de passe">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-error d-none" id="login-error"></div>

          <button type="submit" class="btn btn-primary btn-block btn-lg mt-16" id="login-submit" data-i18n="auth.signIn"></button>

          <div class="flex flex-between mt-16">
            <a href="#" class="text-muted" id="forgot-link" style="font-size:13px" data-i18n="auth.forgot"></a>
          </div>

          <p class="text-center text-muted mt-16" style="font-size:13px">
            <span class="auth-switch" id="switch-to-register" data-i18n="auth.noAccount"></span>
          </p>
        </form>
      </div>

      <div id="panel-register" class="d-none">
        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-fullName" data-i18n="auth.fullName"></label>
            <div class="input-icon">
              <i class="fa-solid fa-user"></i>
              <input class="input" id="reg-fullName" type="text" autocomplete="name" data-i18n-placeholder="auth.fullName">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email" data-i18n="auth.email"></label>
            <div class="input-icon">
              <i class="fa-solid fa-envelope"></i>
              <input class="input" id="reg-email" type="email" autocomplete="email" data-i18n-placeholder="auth.email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone" data-i18n="auth.phone"></label>
            <div class="input-icon">
              <i class="fa-solid fa-phone"></i>
              <input class="input" id="reg-phone" type="tel" autocomplete="tel" data-i18n-placeholder="auth.phone">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password" data-i18n="auth.password"></label>
            <div class="password-wrap">
              <i class="fa-solid fa-lock"></i>
              <input class="input" id="reg-password" type="password" autocomplete="new-password" data-i18n-placeholder="auth.password">
              <button type="button" class="password-toggle" data-toggle-password="reg-password" aria-label="Afficher le mot de passe">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-passwordConfirm" data-i18n="auth.passwordConfirm"></label>
            <div class="password-wrap">
              <i class="fa-solid fa-lock"></i>
              <input class="input" id="reg-passwordConfirm" type="password" autocomplete="new-password" data-i18n-placeholder="auth.passwordConfirm">
              <button type="button" class="password-toggle" data-toggle-password="reg-passwordConfirm" aria-label="Afficher le mot de passe">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-role" data-i18n="auth.role"></label>
            <select class="select" id="reg-role">
              <option value="recruiter" data-i18n="auth.recruiterRole"></option>
              <option value="manager" data-i18n="auth.managerRole"></option>
              <option value="candidate" selected data-i18n="auth.candidateRole"></option>
            </select>
          </div>

          <div class="form-group d-none" id="company-group">
            <label class="form-label" for="reg-company" data-i18n="auth.company"></label>
            <div class="input-icon">
              <i class="fa-solid fa-building"></i>
              <input class="input" id="reg-company" type="text" autocomplete="organization" data-i18n-placeholder="auth.company">
            </div>
          </div>

          <div class="form-error d-none" id="register-error"></div>

          <div class="badge-green d-none" id="register-success" style="padding:12px 14px;border-radius:8px;font-size:14px">
            <i class="fa-solid fa-envelope-circle-check"></i>
            <span data-i18n="auth.checkEmail"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg mt-16" id="register-submit" data-i18n="auth.signUp"></button>

          <p class="text-center text-muted mt-16" style="font-size:13px">
            <span class="auth-switch" id="switch-to-login" data-i18n="auth.haveAccount"></span>
          </p>
        </form>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/ai.js"></script>
<script src="js/widgets.js"></script>
<script src="js/script.js"></script>
<script src="js/liquid-ink.js"></script>
<script>
window.pageInit = async function () {
  var langSelect = document.getElementById('lang-switch');
  if (langSelect) langSelect.setAttribute('aria-label', typeof t === 'function' ? t('lang.label') : 'Langue');

  try {
    var existing = await Auth.init();
    if (existing && existing.user) {
      Auth.redirectByRole(existing.profile || { role: 'candidate' });
      return;
    }
  } catch (err) {
    console.warn('[TalentFlow] auth init', err);
  }

  var cardTitle = document.getElementById('card-title');
  var cardSubtitle = document.getElementById('card-subtitle');
  var panelLogin = document.getElementById('panel-login');
  var panelRegister = document.getElementById('panel-register');
  var tabs = document.querySelectorAll('.tab');

  function showTab(name) {
    tabs.forEach(function (tab) {
      tab.classList.toggle('active', tab.dataset.tab === name);
    });
    panelLogin.classList.toggle('d-none', name !== 'login');
    panelRegister.classList.toggle('d-none', name !== 'register');
    cardTitle.textContent = t(name === 'login' ? 'auth.loginTitle' : 'auth.registerTitle');
    cardSubtitle.textContent = t('auth.loginSubtitle');
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { showTab(tab.dataset.tab); });
  });
  document.getElementById('switch-to-register').addEventListener('click', function () { showTab('register'); });
  document.getElementById('switch-to-login').addEventListener('click', function () { showTab('login'); });

  document.getElementById('forgot-link').addEventListener('click', function (e) {
    e.preventDefault();
    Widgets.toast('La réinitialisation du mot de passe sera bientôt disponible', 'info');
  });

  document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-toggle-password'));
      var icon = btn.querySelector('i');
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    });
  });

  var roleSelect = document.getElementById('reg-role');
  var companyGroup = document.getElementById('company-group');
  roleSelect.addEventListener('change', function () {
    companyGroup.classList.toggle('d-none', roleSelect.value === 'candidate');
  });

  function setError(el, message) {
    el.textContent = message || '';
    el.classList.toggle('d-none', !message);
  }

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var emailEl = document.getElementById('login-email');
    var passEl = document.getElementById('login-password');
    var errEl = document.getElementById('login-error');
    var btn = document.getElementById('login-submit');
    var email = emailEl.value.trim();
    var password = passEl.value;

    emailEl.classList.remove('input-error');
    passEl.classList.remove('input-error');
    setError(errEl, '');

    if (!email || !password) {
      emailEl.classList.toggle('input-error', !email);
      passEl.classList.toggle('input-error', !password);
      setError(errEl, t('auth.fillAll'));
      return;
    }
    if (!EMAIL_RE.test(email)) {
      emailEl.classList.add('input-error');
      setError(errEl, t('auth.invalidEmail'));
      return;
    }

    btn.disabled = true;
    btn.textContent = t('common.loading');
    try {
      var auth = await Auth.login(email, password);
      Widgets.toast(t('toasts.signedIn'), 'success');
      Auth.redirectByRole(auth.profile || { role: 'candidate' });
    } catch (err) {
      setError(errEl, err.message || t('toasts.error'));
      btn.disabled = false;
      btn.textContent = t('auth.signIn');
    }
  });

  document.getElementById('register-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var inputs = {
      fullName: document.getElementById('reg-fullName'),
      email: document.getElementById('reg-email'),
      phone: document.getElementById('reg-phone'),
      password: document.getElementById('reg-password'),
      passwordConfirm: document.getElementById('reg-passwordConfirm'),
      company: document.getElementById('reg-company')
    };
    var errEl = document.getElementById('register-error');
    var successBox = document.getElementById('register-success');
    var btn = document.getElementById('register-submit');
    var role = roleSelect.value;

    Object.values(inputs).forEach(function (el) { el.classList.remove('input-error'); });
    setError(errEl, '');
    successBox.classList.add('d-none');

    var values = {
      fullName: inputs.fullName.value.trim(),
      email: inputs.email.value.trim(),
      phone: inputs.phone.value.trim(),
      password: inputs.password.value,
      passwordConfirm: inputs.passwordConfirm.value,
      company: inputs.company.value.trim(),
      role: role
    };

    var missing = [];
    ['fullName', 'email', 'phone', 'password', 'passwordConfirm'].forEach(function (key) {
      if (!values[key]) missing.push(key);
    });
    if (role !== 'candidate' && !values.company) missing.push('company');

    if (missing.length) {
      missing.forEach(function (key) { inputs[key].classList.add('input-error'); });
      setError(errEl, t('auth.fillAll'));
      return;
    }
    if (!EMAIL_RE.test(values.email)) {
      inputs.email.classList.add('input-error');
      setError(errEl, t('auth.invalidEmail'));
      return;
    }
    if (values.password.length < 6) {
      inputs.password.classList.add('input-error');
      setError(errEl, t('auth.passwordShort'));
      return;
    }
    if (values.password !== values.passwordConfirm) {
      inputs.password.classList.add('input-error');
      inputs.passwordConfirm.classList.add('input-error');
      setError(errEl, 'Les mots de passe ne correspondent pas');
      return;
    }

    btn.disabled = true;
    btn.textContent = t('common.loading');
    try {
      await Auth.register({
        fullName: values.fullName,
        email: values.email,
        phone: values.phone,
        role: values.role,
        company: values.company,
        password: values.password
      });
      var session = await Auth.supabase.auth.getSession();
      if (session && session.data && session.data.session) {
        Widgets.toast(t('toasts.signedUp'), 'success');
        Auth.redirectByRole(Auth.getProfile() || { role: 'candidate' });
        return;
      }
      successBox.classList.remove('d-none');
      btn.disabled = false;
      btn.textContent = t('auth.signUp');
    } catch (err) {
      setError(errEl, err.message || t('toasts.error'));
      btn.disabled = false;
      btn.textContent = t('auth.signUp');
    }
  });
};
</script>
</body>
</html>
