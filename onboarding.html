<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow — Intégration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="onboarding">
<div class="layout">
  <aside class="sidebar">
    <a class="sidebar-logo" href="recruiter-dashboard.html"><i class="fa-solid fa-briefcase"></i> TalentFlow</a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" data-page="dashboard" href="recruiter-dashboard.html"><i class="fa-solid fa-gauge-high"></i><span data-i18n="nav.dashboard">Tableau de bord</span></a>
      <a class="sidebar-link" data-page="offers" href="create-job.html"><i class="fa-solid fa-briefcase"></i><span data-i18n="nav.offers">Offres</span></a>
      <a class="sidebar-link" data-page="candidates" href="candidates.html"><i class="fa-solid fa-users"></i><span data-i18n="nav.candidates">Candidats</span></a>
      <a class="sidebar-link" data-page="screening" href="ai-screening.html"><i class="fa-solid fa-robot"></i><span data-i18n="nav.aiScreening">Présélection IA</span></a>
      <a class="sidebar-link" data-page="interviews" href="interviews.html"><i class="fa-solid fa-calendar-check"></i><span data-i18n="nav.interviews">Entretiens</span></a>
      <a class="sidebar-link" data-page="decisions" href="final-decision.html"><i class="fa-solid fa-list-check"></i><span data-i18n="nav.decisions">Décisions</span></a>
      <a class="sidebar-link" data-page="job-offer" href="job-offer.html"><i class="fa-solid fa-file-circle-check"></i><span data-i18n="nav.offerLetters">Lettres d'offre</span></a>
      <a class="sidebar-link" data-page="onboarding" href="onboarding.html"><i class="fa-solid fa-user-check"></i><span data-i18n="nav.onboarding">Intégration</span></a>
      <a class="sidebar-link admin-only" data-page="admin-users" href="admin-users.html"><i class="fa-solid fa-user-shield"></i><span data-i18n="nav.admin">Administration</span></a>
    </nav>
    <div class="sidebar-footer">
      <span class="avatar" data-avatar></span>
      <div class="sidebar-user">
        <div class="sidebar-user-name" data-user-name></div>
        <div class="sidebar-user-role" data-user-role></div>
      </div>
      <button type="button" class="sidebar-logout" data-logout title="Déconnexion"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </aside>
  <div class="sidebar-overlay"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="btn btn-icon btn-outline" data-sidebar-toggle aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title" data-topbar-name></div>
      <div class="topbar-actions">
        <select id="lang-switch" class="lang-switch" aria-label="Langue"></select>
      </div>
    </header>
    <main class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title" data-i18n="onboarding.title">Intégration</h1>
          <p class="page-subtitle" data-i18n="onboarding.subtitle">Accueillez vos nouveaux talents</p>
        </div>
        <button type="button" class="btn btn-primary" id="btn-new"><i class="fa-solid fa-list-check"></i> <span data-i18n="onboarding.new">Nouvelle intégration</span></button>
      </div>
      <div class="filter-bar">
        <div class="form-group">
          <label class="form-label" data-i18n="common.allOffers">Toutes les offres</label>
          <select id="filter-offer" class="select">
            <option value=""></option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="common.allStatuses">Tous les statuts</label>
          <select id="filter-status" class="select">
            <option value=""></option>
          </select>
        </div>
      </div>
      <div class="stats-grid" id="stats"></div>
      <div class="card">
        <div class="card-header">
          <h3 data-i18n="onboarding.title">Intégration</h3>
        </div>
        <div class="card-body" id="onboardings-table"></div>
      </div>
      <div class="card" style="margin-top:20px">
        <div class="card-header">
          <h3 data-i18n="onboarding.timeline">Chronologie</h3>
        </div>
        <div class="card-body" id="timeline-wrap"></div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/ai.js"></script>
<script src="js/widgets.js"></script>
<script src="js/script.js"></script>
<script>
(async function pageInit() {
  'use strict';
  const profile = await Auth.requireAuth(['recruiter', 'manager']);
  if (!profile) return;
  if (window.initSharedLayout) window.initSharedLayout(profile);
  if (window.Widgets) Widgets.applyTranslations();

  const SUGGESTED_ITEMS = [
    'Création du compte email entreprise',
    'Attribution du poste de travail (bureau, PC, badge)',
    'Inscription mutuelle & sécurité sociale',
    'Formation d\'accueil',
    'Présentation à l\'équipe',
    'Remise du matériel',
    'Signature du contrat'
  ];

  let offers = [];
  let allApps = [];
  let candidatesApps = [];
  let onboardings = [];
  let lettersByApp = {};
  let currentOffer = '';
  let currentStatus = '';

  const els = {
    filterOffer: document.getElementById('filter-offer'),
    filterStatus: document.getElementById('filter-status'),
    stats: document.getElementById('stats'),
    table: document.getElementById('onboardings-table'),
    timeline: document.getElementById('timeline-wrap'),
    btnNew: document.getElementById('btn-new')
  };

  async function loadAll() {
    const results = await Promise.all([DB.getJobOffers({}), DB.getApplications({}), DB.getOnboardings({})]);
    offers = results[0] || [];
    allApps = results[1] || [];
    candidatesApps = allApps.filter(function (a) { return a.status === 'offered' || a.status === 'hired'; });
    onboardings = results[2] || [];
    const letterPromises = onboardings.map(function (o) {
      return DB.getOfferLetters({ application_id: o.application_id }).then(function (rows) {
        lettersByApp[o.application_id] = (rows && rows[0]) || null;
      }).catch(function () {
        lettersByApp[o.application_id] = null;
      });
    });
    await Promise.all(letterPromises);
  }

  function fillFilters() {
    els.filterOffer.innerHTML = '<option value="">' + Widgets.escapeHTML(t('common.allOffers')) + '</option>' +
      offers.map(function (o) {
        return '<option value="' + Widgets.escapeHTML(o.id) + '">' + Widgets.escapeHTML(o.title || o.department || o.id) + '</option>';
      }).join('');
    els.filterStatus.innerHTML =
      '<option value="">' + Widgets.escapeHTML(t('common.allStatuses')) + '</option>' +
      '<option value="in_progress">' + Widgets.escapeHTML(t('status.in_progress')) + '</option>' +
      '<option value="completed">' + Widgets.escapeHTML(t('status.completed')) + '</option>';
  }

  function filteredOnboardings() {
    return onboardings.filter(function (o) {
      if (currentOffer && String(o.applications ? o.applications.job_offer_id : '') !== String(currentOffer)) return false;
      if (currentStatus && o.status !== currentStatus) return false;
      return true;
    });
  }

  function renderStats() {
    const rows = filteredOnboardings();
    const count = function (s) { return rows.filter(function (o) { return o.status === s; }).length; };
    const pvSigned = rows.filter(function (o) { return o.pv_signed; }).length;
    els.stats.innerHTML =
      Widgets.statCard({ icon: 'fa-spinner', color: 'blue', value: count('in_progress'), label: t('onboarding.statusInProgress') }) +
      Widgets.statCard({ icon: 'fa-check-circle', color: 'green', value: count('completed'), label: t('onboarding.statusCompleted') }) +
      Widgets.statCard({ icon: 'fa-file-signature', color: 'purple', value: pvSigned, label: t('onboarding.pvSigned') });
  }

  function checklistCell(o) {
    const items = o.items || [];
    const done = items.filter(function (i) { return i && i.done; }).length;
    const total = items.length || 0;
    const pct = total ? Math.round((done / total) * 100) : 0;
    return '<div style="min-width:140px">' +
      '<div class="progress"><div class="progress-bar ' + (pct === 100 ? 'green' : 'orange') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="timeline-date">' + done + '/' + total + '</div></div>';
  }

  function renderTable() {
    const rows = filteredOnboardings();
    Widgets.renderTable(els.table, {
      columns: [
        { label: t('common.name'), render: function (r) {
          const c = r.applications ? r.applications.candidates : {};
          return '<div style="display:flex;align-items:center;gap:10px">' + Widgets.avatar(c.full_name, 'avatar-sm') + '<span>' + Widgets.escapeHTML(c.full_name || '—') + '</span></div>';
        } },
        { label: t('letter.jobTitle'), render: function (r) { return Widgets.escapeHTML((r.applications && r.applications.job_offers && r.applications.job_offers.title) || '—'); } },
        { label: t('onboarding.startDate'), render: function (r) { return Widgets.formatDate(r.start_date) || '—'; } },
        { label: t('onboarding.checklist'), render: checklistCell },
        { label: t('onboarding.pv'), render: function (r) {
          return r.pv_document_url
            ? '<button type="button" class="btn btn-outline btn-sm" data-action="pv" data-id="' + Widgets.escapeHTML(r.id) + '"><i class="fa-solid fa-file-pdf"></i> ' + Widgets.escapeHTML(t('common.view')) + '</button>'
            : '<span class="text-muted">—</span>';
        } },
        { label: t('onboarding.pvSigned'), render: function (r) {
          return r.pv_signed
            ? '<i class="fa-solid fa-check" style="color:#16a34a"></i>'
            : '<i class="fa-solid fa-xmark" style="color:#94a3b8"></i>';
        } },
        { label: t('common.status'), render: function (r) { return Widgets.badge(r.status); } },
        { label: t('common.actions'), render: function (r) {
          return '<button type="button" class="btn btn-icon btn-outline" title="' + Widgets.escapeHTML(t('common.edit')) + '" data-action="edit" data-id="' + Widgets.escapeHTML(r.id) + '"><i class="fa-solid fa-pen"></i></button>';
        } }
      ],
      rows: rows,
      emptyText: t('onboarding.noOnboardings')
    });
    els.table.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const onb = onboardings.find(function (o) { return String(o.id) === String(btn.getAttribute('data-id')); });
        if (!onb) return;
        if (btn.getAttribute('data-action') === 'pv') openPvModal(onb);
        else openEditModal(onb);
      });
    });
  }

  function renderTimeline() {
    const rows = filteredOnboardings();
    if (!rows.length) {
      Widgets.emptyState(els.timeline, 'fa-regular fa-list-check', t('onboarding.noOnboardings'));
      return;
    }
    let html = '';
    rows.forEach(function (o) {
      const c = o.applications ? o.applications.candidates : {};
      const j = o.applications ? o.applications.job_offers : {};
      const items = o.items || [];
      html += '<div style="border-bottom:1px solid #e2e8f0;padding:14px 0">' +
        '<h4 style="margin:0 0 12px;font-size:14px;font-weight:700">' + Widgets.escapeHTML(c.full_name || '—') + ' — ' + Widgets.escapeHTML(j.title || '') + (o.start_date ? ' <span class="timeline-date">(' + Widgets.formatDate(o.start_date) + ')</span>' : '') + '</h4>' +
        '<div class="timeline">' +
        items.map(function (it) {
          const done = !!(it && it.done);
          let sub = done
            ? '<div class="timeline-validator">' + Widgets.escapeHTML([t('onboarding.validator') + ' : ' + (it.validator || '—'), it.date ? Widgets.formatDate(it.date) : ''].filter(Boolean).join(' — ')) + '</div>'
            : '<div class="timeline-item-text">' + Widgets.escapeHTML(t('onboarding.toComplete')) + '</div>';
          return '<div class="timeline-item' + (done ? ' done' : '') + '"><span class="timeline-dot"></span>' +
            '<div class="timeline-item-title">' + Widgets.escapeHTML(it ? it.label || '' : '') + '</div>' + sub + '</div>';
        }).join('') +
        '</div></div>';
    });
    els.timeline.innerHTML = html;
  }

  function renderAll() {
    renderStats();
    renderTable();
    renderTimeline();
  }

  function openPvModal(onb) {
    let viewer = null;
    const p = Widgets.modal({
      title: t('onboarding.pv'),
      bodyHTML: '<div id="pv-viewer" style="min-height:420px"></div>',
      confirmText: t('common.close'),
      hideCancel: true
    });
    viewer = Widgets.initPDFViewer(document.getElementById('pv-viewer'), onb.pv_document_url);
    p.then(function () { if (viewer && viewer.destroy) viewer.destroy(); });
  }

  let nbItems = [];

  function renderNbTags() {
    const wrap = document.getElementById('nb-tags');
    if (!wrap) return;
    wrap.innerHTML = nbItems.map(function (item, i) {
      return '<span class="tag">' + Widgets.escapeHTML(item) + ' <button type="button" data-remove="' + i + '" aria-label="Retirer"><i class="fa-solid fa-xmark"></i></button></span>';
    }).join('') || '<span class="text-muted">' + Widgets.escapeHTML(t('onboarding.items')) + '</span>';
    wrap.querySelectorAll('[data-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        nbItems.splice(Number(btn.getAttribute('data-remove')), 1);
        renderNbTags();
      });
    });
  }

  async function openNewModal() {
    nbItems = [];
    const opts = candidatesApps.map(function (a) {
      return { id: a.id, label: ((a.candidates && a.candidates.full_name) || '') + ' — ' + ((a.job_offers && a.job_offers.title) || '') };
    });
    const bodyHTML =
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('common.selectOffer')) + ' <span class="required">*</span></label>' +
      '<select id="nb-app" class="select">' +
      opts.map(function (o) { return '<option value="' + Widgets.escapeHTML(o.id) + '">' + Widgets.escapeHTML(o.label) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.startDate')) + '</label>' +
      '<input id="nb-date" class="input" type="date"></div>' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.checklist')) + '</label>' +
      '<div id="nb-tags" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<input id="nb-item" class="input" placeholder="' + Widgets.escapeHTML(t('onboarding.itemLabel')) + '" style="flex:1;min-width:160px">' +
      '<button type="button" class="btn btn-outline" id="nb-add"><i class="fa-solid fa-plus"></i> ' + Widgets.escapeHTML(t('onboarding.addItem')) + '</button>' +
      '<button type="button" class="btn btn-outline" id="nb-suggest"><i class="fa-solid fa-lightbulb"></i> Suggestions</button>' +
      '</div></div>';
    const p = Widgets.modal({
      title: t('onboarding.new'),
      bodyHTML: bodyHTML,
      confirmText: t('common.save'),
      cancelText: t('common.cancel')
    });
    renderNbTags();
    document.getElementById('nb-add').addEventListener('click', function () {
      const val = document.getElementById('nb-item').value.trim();
      if (!val) return;
      nbItems.push(val);
      document.getElementById('nb-item').value = '';
      renderNbTags();
    });
    document.getElementById('nb-item').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('nb-add').click();
      }
    });
    document.getElementById('nb-suggest').addEventListener('click', function () {
      SUGGESTED_ITEMS.forEach(function (s) {
        if (nbItems.indexOf(s) === -1) nbItems.push(s);
      });
      renderNbTags();
    });
    const ok = await p;
    if (!ok) return;
    const applicationId = document.getElementById('nb-app').value;
    const startDate = document.getElementById('nb-date').value;
    const app = allApps.find(function (a) { return String(a.id) === String(applicationId); });
    if (!app) {
      Widgets.toast(Widgets.escapeHTML(t('toasts.error')), 'error');
      return;
    }
    els.btnNew.disabled = true;
    try {
      await DB.createOnboarding({
        application_id: applicationId,
        job_offer_id: app.job_offer_id,
        candidate_id: app.candidate_id,
        start_date: startDate || null,
        items: nbItems.map(function (label) { return { label: label, done: false }; }),
        status: 'in_progress'
      });
      Widgets.toast(t('toasts.saved'), 'success');
      window.location.reload();
    } catch (e) {
      Widgets.toast(Widgets.escapeHTML(e.message || t('toasts.error')), 'error');
    } finally {
      els.btnNew.disabled = false;
    }
  }

  function saveOnboarding(onb, data, onDone) {
    DB.updateOnboarding(onb.id, data).then(function () {
      Object.assign(onb, data);
      Widgets.toast(t('toasts.saved'), 'success');
      renderTable();
      renderTimeline();
      if (typeof onDone === 'function') onDone();
    }).catch(function (e) {
      Widgets.toast(Widgets.escapeHTML(e.message || t('toasts.error')), 'error');
    });
  }

  function renderEditChecklist(onb) {
    const wrap = document.getElementById('ed-checklist');
    if (!wrap) return;
    const items = onb.items || [];
    wrap.innerHTML = items.length ? items.map(function (it, i) {
      const done = !!(it && it.done);
      const sub = (done && (it.validator || it.date))
        ? '<div class="timeline-validator" style="margin:2px 0 0 24px">' + Widgets.escapeHTML([t('onboarding.validator') + ' : ' + (it.validator || '—'), it.date ? Widgets.formatDate(it.date) : ''].filter(Boolean).join(' — ')) + '</div>'
        : '';
      return '<div style="margin-bottom:10px"><label class="checkbox-label">' +
        '<input type="checkbox" class="checkbox" data-item="' + i + '"' + (done ? ' checked' : '') + '>' +
        Widgets.escapeHTML(it ? it.label || '' : '') + '</label>' + sub + '</div>';
    }).join('') : '<p class="text-muted">' + Widgets.escapeHTML(t('onboarding.checklist')) + '</p>';
    wrap.querySelectorAll('[data-item]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        const idx = Number(cb.getAttribute('data-item'));
        const it = (onb.items || [])[idx];
        if (!it) return;
        it.done = cb.checked;
        if (cb.checked) {
          it.date = new Date().toISOString().slice(0, 10);
          it.validator = profile.full_name || '';
        } else {
          it.date = null;
          it.validator = null;
        }
        saveOnboarding(onb, { items: onb.items }, function () { renderEditChecklist(onb); });
      });
    });
  }

  async function openEditModal(onb) {
    const app = allApps.find(function (a) { return String(a.id) === String(onb.application_id); }) || {};
    const cand = app.candidates || {};
    const job = app.job_offers || {};
    const letter = lettersByApp[onb.application_id] || null;
    const items = onb.items || [];
    const bodyHTML =
      '<div style="margin-bottom:12px"><strong>' + Widgets.escapeHTML(cand.full_name || '—') + '</strong> — ' + Widgets.escapeHTML(job.title || '') + '</div>' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.checklist')) + '</label>' +
      '<div id="ed-checklist"></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
      '<input id="ed-item" class="input" placeholder="' + Widgets.escapeHTML(t('onboarding.itemLabel')) + '" style="flex:1;min-width:140px">' +
      '<button type="button" class="btn btn-outline" id="ed-add"><i class="fa-solid fa-plus"></i> ' + Widgets.escapeHTML(t('onboarding.addItem')) + '</button>' +
      '</div></div>' +
      '<div class="form-grid-2">' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.startDate')) + '</label>' +
      '<input id="ed-date" class="input" type="date" value="' + Widgets.escapeHTML(onb.start_date || '') + '"></div>' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('common.status')) + '</label>' +
      '<select id="ed-status" class="select">' +
      '<option value="in_progress"' + (onb.status === 'in_progress' ? ' selected' : '') + '>' + Widgets.escapeHTML(t('status.in_progress')) + '</option>' +
      '<option value="completed"' + (onb.status === 'completed' ? ' selected' : '') + '>' + Widgets.escapeHTML(t('status.completed')) + '</option>' +
      '</select></div>' +
      '</div>' +
      '<div style="border-top:1px solid #e2e8f0;margin:12px 0;padding-top:12px">' +
      '<div class="form-label">' + Widgets.escapeHTML(t('onboarding.pv')) + '</div>' +
      '<div class="form-grid-2">' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.salary')) + '</label>' +
      '<input id="ed-salary" class="input" type="text" value="' + Widgets.escapeHTML((letter && letter.salary) || '') + '"></div>' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.startDate')) + '</label>' +
      '<input id="ed-pv-date" class="input" type="date" value="' + Widgets.escapeHTML(onb.start_date || '') + '"></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.conditions')) + '</label>' +
      '<textarea id="ed-conditions" class="textarea" rows="2">' + Widgets.escapeHTML((letter && letter.conditions) || '') + '</textarea></div>' +
      '<div class="form-group"><label class="form-label">' + Widgets.escapeHTML(t('onboarding.regulations')) + '</label>' +
      '<textarea id="ed-regulations" class="textarea" rows="2"></textarea></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<button type="button" class="btn btn-primary" id="ed-pv-generate"><i class="fa-solid fa-file-pdf"></i> ' + Widgets.escapeHTML(t('onboarding.pvGenerate')) + '</button>' +
      '<button type="button" class="btn btn-outline" id="ed-pv-upload"><i class="fa-solid fa-upload"></i> ' + Widgets.escapeHTML(t('onboarding.uploadPv')) + '</button>' +
      '<input type="file" id="ed-pv-file" accept=".pdf,application/pdf" style="display:none">' +
      '<label class="switch-label"><span class="switch"><input type="checkbox" id="ed-pv-signed"' + (onb.pv_signed ? ' checked' : '') + '><span class="switch-slider"></span></span><span>' + Widgets.escapeHTML(t('onboarding.pvSigned')) + '</span></label>' +
      '</div></div>' +
      '<div style="margin-top:14px;text-align:right">' +
      '<button type="button" class="btn btn-success" id="ed-complete"><i class="fa-solid fa-check"></i> ' + Widgets.escapeHTML(t('onboarding.markComplete')) + '</button>' +
      '</div>';
    const p = Widgets.modal({
      title: t('common.edit'),
      bodyHTML: bodyHTML,
      confirmText: t('common.close'),
      hideCancel: true
    });
    renderEditChecklist(onb);
    document.getElementById('ed-add').addEventListener('click', function () {
      const val = document.getElementById('ed-item').value.trim();
      if (!val) return;
      onb.items = (onb.items || []).concat([{ label: val, done: false }]);
      document.getElementById('ed-item').value = '';
      saveOnboarding(onb, { items: onb.items }, function () { renderEditChecklist(onb); });
    });
    document.getElementById('ed-date').addEventListener('change', function () {
      saveOnboarding(onb, { start_date: this.value || null });
    });
    document.getElementById('ed-status').addEventListener('change', function () {
      saveOnboarding(onb, { status: this.value });
    });
    document.getElementById('ed-pv-signed').addEventListener('change', function () {
      saveOnboarding(onb, { pv_signed: this.checked });
    });
    document.getElementById('ed-pv-upload').addEventListener('click', function () {
      document.getElementById('ed-pv-file').click();
    });
    document.getElementById('ed-pv-file').addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;
      const path = 'pv/' + Date.now() + '/' + file.name;
      DB.uploadFile('pv', file, path).then(function (url) {
        onb.pv_document_url = url;
        return DB.updateOnboarding(onb.id, { pv_document_url: url });
      }).then(function () {
        Widgets.toast(t('toasts.saved'), 'success');
        renderTable();
      }).catch(function (e) {
        Widgets.toast(Widgets.escapeHTML(e.message || t('toasts.error')), 'error');
      });
    });
    document.getElementById('ed-pv-generate').addEventListener('click', async function () {
      const btn = this;
      btn.disabled = true;
      try {
        const pdf = await AI.generatePdf('pv', {
          company: profile.company || '',
          candidate_name: cand.full_name || '',
          job_title: job.title || '',
          department: job.department || '',
          manager_name: profile.full_name || '',
          manager: profile.full_name || '',
          salary: document.getElementById('ed-salary').value.trim(),
          start_date: document.getElementById('ed-pv-date').value,
          conditions: document.getElementById('ed-conditions').value.trim(),
          regulations: document.getElementById('ed-regulations').value.trim()
        });
        await DB.updateOnboarding(onb.id, { pv_document_url: pdf.url });
        onb.pv_document_url = pdf.url;
        Widgets.toast(t('onboarding.pvGenerated'), 'success');
        renderTable();
      } catch (e) {
        Widgets.toast(Widgets.escapeHTML(e.message || t('onboarding.pvGenerated')), 'error');
        fallbackPv({
          company: profile.company || '',
          candidate_name: cand.full_name || '',
          job_title: job.title || '',
          department: job.department || '',
          manager_name: profile.full_name || '',
          salary: document.getElementById('ed-salary').value.trim(),
          start_date: document.getElementById('ed-pv-date').value,
          conditions: document.getElementById('ed-conditions').value.trim(),
          regulations: document.getElementById('ed-regulations').value.trim()
        });
      } finally {
        btn.disabled = false;
      }
    });
    document.getElementById('ed-complete').addEventListener('click', async function () {
      if (onb.status !== 'completed') {
        saveOnboarding(onb, { status: 'completed' }, function () { renderEditChecklist(onb); });
      }
      const ok = await Widgets.confirm(t('onboarding.notifyManager'));
      if (!ok) return;
      try {
        const profiles = await DB.getCompanyProfiles();
        const managers = (profiles || []).filter(function (pr) { return pr.role === 'manager'; });
        if (!managers.length) {
          Widgets.toast(Widgets.escapeHTML(t('toasts.error')), 'error');
          return;
        }
        const subject = (t('email.acceptedSubject') || '').replace(/\{job\}/g, job.title || '');
        const body = (t('email.acceptedBody') || '')
          .replace(/\{candidate\}/g, cand.full_name || '')
          .replace(/\{job\}/g, job.title || '')
          .replace(/\{company\}/g, profile.company || '');
        await AI.sendEmail(managers[0].email, subject, body);
        Widgets.toast(t('onboarding.completedNotify'), 'success');
      } catch (e) {
        Widgets.toast(Widgets.escapeHTML(e.message || t('toasts.error')), 'error');
      }
    });
    await p;
  }

  function fallbackPv(data) {
    const rows = [
      ['Candidat', data.candidate_name],
      ['Poste', data.job_title],
      ['Département', data.department],
      ['Manager', data.manager_name],
      ['Salaire', data.salary],
      ['Date de début', data.start_date],
      ['Conditions', data.conditions],
      ['Règlement intérieur', data.regulations]
    ];
    if (window.jspdf && window.jspdf.jsPDF) {
      const doc = new window.jspdf.jsPDF();
      doc.setFontSize(16);
      doc.text("PROCÈS-VERBAL D'INSTALLATION", 105, 20, { align: 'center' });
      doc.setFontSize(10);
      let y = 40;
      rows.forEach(function (r) {
        doc.setFont(undefined, 'bold');
        doc.text(String(r[0] || ''), 20, y);
        doc.setFont(undefined, 'normal');
        const lines = doc.splitTextToSize(String(r[1] || ''), 130);
        doc.text(lines, 70, y);
        y += Math.max(10, lines.length * 5) + 4;
      });
      doc.save('pv-installation-' + Date.now() + '.pdf');
    } else {
      Widgets.generatePDF(
        '<h1>PROCÈS-VERBAL D\'INSTALLATION</h1>' +
        rows.map(function (r) { return '<p><strong>' + Widgets.escapeHTML(r[0] || '') + '</strong><br>' + Widgets.escapeHTML(r[1] || '') + '</p>'; }).join(''),
        'pv-installation.pdf'
      );
    }
  }

  els.btnNew.addEventListener('click', openNewModal);
  els.filterOffer.addEventListener('change', function () {
    currentOffer = els.filterOffer.value;
    renderAll();
  });
  els.filterStatus.addEventListener('change', function () {
    currentStatus = els.filterStatus.value;
    renderAll();
  });

  try {
    await loadAll();
  } catch (e) {
    Widgets.toast(Widgets.escapeHTML(e.message || t('toasts.error')), 'error');
  }
  fillFilters();
  renderAll();
})();
</script>
</body>
</html>
