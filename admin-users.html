<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-users">
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><i class="fa-solid fa-bolt"></i><span data-i18n="splash.title">TalentFlow</span></div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" data-page="recruiter-dashboard" href="recruiter-dashboard.html"><i class="fa-solid fa-chart-pie"></i><span data-i18n="nav.dashboard">Tableau de bord</span></a>
      <a class="sidebar-link" data-page="create-job" href="create-job.html"><i class="fa-solid fa-briefcase"></i><span data-i18n="nav.offers">Offres</span></a>
      <a class="sidebar-link" data-page="candidates" href="candidates.html"><i class="fa-solid fa-users"></i><span data-i18n="nav.candidates">Candidats</span></a>
      <a class="sidebar-link" data-page="ai-screening" href="ai-screening.html"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="nav.aiScreening">Présélection IA</span></a>
      <a class="sidebar-link" data-page="interviews" href="interviews.html"><i class="fa-solid fa-calendar-check"></i><span data-i18n="nav.interviews">Entretiens</span></a>
      <a class="sidebar-link" data-page="final-decision" href="final-decision.html"><i class="fa-solid fa-gavel"></i><span data-i18n="nav.decisions">Décisions</span></a>
      <a class="sidebar-link" data-page="job-offer" href="job-offer.html"><i class="fa-solid fa-file-signature"></i><span data-i18n="nav.offerLetters">Lettres d'offre</span></a>
      <a class="sidebar-link" data-page="onboarding" href="onboarding.html"><i class="fa-solid fa-rocket"></i><span data-i18n="nav.onboarding">Intégration</span></a>
      <a class="sidebar-link admin-only" data-page="admin-users" href="admin-users.html"><i class="fa-solid fa-user-shield"></i><span data-i18n="nav.admin">Administration</span></a>
    </nav>
    <div class="sidebar-footer">
      <span class="avatar" data-avatar>?</span>
      <div class="sidebar-user">
        <div class="sidebar-user-name" data-user-name>—</div>
        <div class="sidebar-user-role" data-user-role>—</div>
      </div>
      <button type="button" class="sidebar-logout" data-logout title="Déconnexion"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </aside>
  <div class="sidebar-overlay"></div>
  <main class="main">
    <header class="topbar">
      <button type="button" class="btn btn-icon btn-outline" data-sidebar-toggle aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title" data-topbar-name></div>
      <div class="topbar-actions">
        <select class="select lang-switch" id="lang-switch"></select>
      </div>
    </header>
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title" data-i18n="nav.admin">Administration</h1>
          <p class="page-subtitle" data-i18n="admin.subtitle">Gestion des utilisateurs et des rôles</p>
        </div>
      </div>

      <div class="filter-bar">
        <div class="form-group search-box" style="flex:1;min-width:220px">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" class="input search-input" id="f-search" data-i18n-placeholder="admin.searchPlaceholder" placeholder="Rechercher un utilisateur…">
        </div>
      </div>

      <div id="table-container"></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/widgets.js"></script>
<script src="js/script.js"></script>
<script>
(function () {
  'use strict';
  var esc = Widgets.escapeHTML;
  var state = { users: [], search: '', meId: null, saving: {} };
  var container = document.getElementById('table-container');

  var ROLES = ['candidate', 'recruiter', 'manager', 'admin'];

  function roleLabel(key) {
    var map = {
      candidate: 'auth.candidateRole',
      recruiter: 'auth.recruiterRole',
      manager: 'auth.managerRole',
      admin: 'auth.adminRole'
    };
    var k = map[key] || 'auth.candidateRole';
    return typeof t === 'function' ? t(k) : key;
  }

  function roleSelectHtml(user) {
    var disabled = user.id === state.meId ? ' disabled' : '';
    var opts = ROLES.map(function (r) {
      return '<option value="' + r + '"' + (user.role === r ? ' selected' : '') + '>' + esc(roleLabel(r)) + '</option>';
    }).join('');
    return '<select class="select" data-role-select="' + esc(user.id) + '"' + disabled + '>' + opts + '</select>';
  }

  function render() {
    var q = state.search.toLowerCase();
    var rows = state.users
      .filter(function (u) { return !q || (u.full_name || '').toLowerCase().indexOf(q) > -1 || (u.email || '').toLowerCase().indexOf(q) > -1; })
      .map(function (u) {
        var initials = String(u.full_name || u.email || '?').split(/\s+/).filter(Boolean).map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase();
        var me = u.id === state.meId ? ' <span class="badge badge-blue">' + esc(t('common.you')) + '</span>' : '';
        var saving = state.saving[u.id] ? '<span class="text-muted" style="font-size:13px"><i class="fa-solid fa-circle-notch fa-spin"></i></span>' :
          '<button type="button" class="btn btn-sm btn-outline" data-save-role="' + esc(u.id) + '"><i class="fa-solid fa-floppy-disk"></i> <span>' + esc(t('admin.save')) + '</span></button>';
        return '<tr>' +
          '<td><div class="flex" style="gap:12px;align-items:center">' +
          '<span class="avatar avatar-sm">' + esc(initials) + '</span>' +
          '<div><div style="font-weight:600">' + esc(u.full_name || '—') + me + '</div>' +
          '<div class="text-muted" style="font-size:13px">' + esc(u.email || '') + '</div></div></div></td>' +
          '<td>' + roleSelectHtml(u) + '</td>' +
          '<td class="text-right">' + saving + '</td>' +
          '</tr>';
      })
      .join('');

    if (!rows) {
      container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-users-slash"></i><p>' + esc(t('candidates.noCandidates')) + '</p></div>';
      return;
    }
    container.innerHTML =
      '<div class="table-wrap"><table class="table">' +
      '<thead><tr>' +
      '<th>' + esc(t('admin.users')) + '</th>' +
      '<th>' + esc(t('admin.role')) + '</th>' +
      '<th class="text-right">' + esc(t('admin.save')) + '</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  async function loadUsers() {
    var { data, error } = await Auth.supabase.from('profiles').select('id, full_name, email, role').order('created_at', { ascending: false });
    if (error) throw new Error(getErrorMessage(error));
    state.users = data || [];
    render();
  }

  async function saveRole(id, role) {
    var { error } = await Auth.supabase.from('profiles').update({ role: role }).eq('id', id);
    if (error) throw new Error(getErrorMessage(error));
    state.users.forEach(function (u) { if (u.id === id) u.role = role; });
    Widgets.toast(t('admin.saved'), 'success');
  }

  document.getElementById('f-search').addEventListener('input', Widgets.debounce(function (e) {
    state.search = e.target.value.trim();
    render();
  }, 250));

  container.addEventListener('click', async function (e) {
    var btn = e.target.closest('[data-save-role]');
    if (!btn) return;
    var id = btn.getAttribute('data-save-role');
    var select = document.querySelector('[data-role-select="' + id + '"]');
    var role = select ? select.value : '';
    state.saving[id] = true;
    render();
    try {
      await saveRole(id, role);
    } catch (err) {
      Widgets.toast(getErrorMessage(err), 'error');
    }
    delete state.saving[id];
    render();
  });

  async function init() {
    try {
      var profile = await Auth.requireAuth(['admin']);
      if (!profile) return;
      if (window.initSharedLayout) window.initSharedLayout(profile);
      state.meId = profile.id;
      await loadUsers();
    } catch (e) {
      Widgets.toast(getErrorMessage(e), 'error');
    }
  }

  init();
})();
</script>
</body>
</html>
