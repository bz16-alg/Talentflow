<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow — Réponse à l'offre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/ui-mode.js?v=20260809"></script>
</head>
<body data-page="offer-response">
<header class="topbar" style="position:static">
  <span class="auth-logo" style="margin:0"><i class="fa-solid fa-briefcase"></i><span>TalentFlow</span></span>
  <div class="topbar-actions">
      <button type="button" class="btn btn-icon btn-outline mode-toggle" data-mode-toggle aria-label="Mode sombre" title="Mode sombre"><i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i></button>
    <select id="lang-switch" class="lang-switch" aria-label="Langue"></select>
  </div>
</header>
<main class="page" style="max-width:560px;margin:0 auto">
  <div class="signin-card" id="response-card">
    <div id="response-view">
      <div style="text-align:center;margin-bottom:20px">
        <i class="fa-solid fa-file-signature" style="font-size:56px;color:#2563eb"></i>
        <h2 data-i18n="offerResp.title">Réponse à l'offre</h2>
        <p class="page-subtitle" id="offer-intro"></p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button type="button" class="btn btn-success btn-lg" id="btn-accept"><i class="fa-solid fa-check"></i> <span data-i18n="offerResp.accept">J'accepte l'offre</span></button>
        <button type="button" class="btn btn-danger btn-lg" id="btn-refuse"><i class="fa-solid fa-xmark"></i> <span data-i18n="offerResp.refuse">Je refuse l'offre</span></button>
        <button type="button" class="btn btn-outline btn-lg" id="btn-negotiate"><i class="fa-solid fa-handshake"></i> <span data-i18n="offerResp.negotiate">Je souhaite négocier</span></button>
      </div>
      <div id="negotiate-form" style="display:none;margin-top:20px">
        <div class="form-group">
          <label class="form-label" for="n-salary" data-i18n="offerResp.negotiateSalary">Négocier le salaire</label>
          <input id="n-salary" class="input" type="text" placeholder="Ex. : 130 000 DA / mois">
        </div>
        <div class="form-group">
          <label class="form-label" for="n-start" data-i18n="offerResp.negotiateStart">Négocier la date de début</label>
          <input id="n-start" class="input" type="date">
        </div>
        <div class="form-group">
          <label class="form-label" for="n-message" data-i18n="offerResp.negotiateMessage">Votre message</label>
          <textarea id="n-message" class="textarea" rows="4"></textarea>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="btn-negotiate-send"><i class="fa-solid fa-paper-plane"></i> <span data-i18n="common.send">Envoyer</span></button>
      </div>
      <p class="text-muted" id="demo-note" style="display:none;margin-top:16px;font-size:12px" data-i18n="offerResp.demoNote">Cette page est une démo</p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/ai.js"></script>
<script src="js/widgets.js"></script>
<script src="js/script.js"></script>
<script>
(async function pageInit() {
  'use strict';
  if (window.Widgets) Widgets.applyTranslations();

  const params = new URLSearchParams(window.location.search);
  const letterId = params.get('letter');

  const intro = document.getElementById('offer-intro');
  let letter = null;
  try {
    const letters = await DB.getOfferLetters({});
    letter = (letters || []).find(function (l) { return String(l.id) === String(letterId); }) || null;
    if (letter) {
      const job = letter.applications && letter.applications.job_offers ? letter.applications.job_offers.title : '';
      const cand = letter.applications && letter.applications.candidates ? letter.applications.candidates.full_name : '';
      intro.textContent = t('offerResp.intro') + (job ? ' ' + job : '') + (cand ? ' — ' + cand : '');
    } else {
      intro.textContent = t('offerResp.letterMissing');
    }
  } catch (e) {
    intro.textContent = t('offerResp.letterMissing');
  }

  const view = document.getElementById('response-view');
  const buttons = ['btn-accept', 'btn-refuse', 'btn-negotiate'].map(function (id) { return document.getElementById(id); });
  const negotiateForm = document.getElementById('negotiate-form');
  const demoNote = document.getElementById('demo-note');

  function setBusy(busy) {
    buttons.forEach(function (b) { b.disabled = busy; });
    document.getElementById('btn-negotiate-send').disabled = busy;
  }

  function showSuccess(response) {
    view.innerHTML =
      '<div style="text-align:center;padding:40px 20px">' +
      '<i class="fa-solid fa-circle-check" style="font-size:64px;color:#16a34a;margin-bottom:16px"></i>' +
      '<h2>' + Widgets.escapeHTML(t('offerResp.thanks')) + '</h2>' +
      '<p class="text-muted">' + Widgets.escapeHTML(t('offerResp.' + response + 'Msg')) + '</p>' +
      '</div>';
  }

  async function respond(response, payload) {
    if (!letterId) {
      demoNote.style.display = 'block';
      Widgets.toast(Widgets.escapeHTML(t('toasts.error')), 'error');
      return;
    }
    setBusy(true);
    try {
      await AI.candidateResponse(letterId, response, payload || {});
      showSuccess(response);
    } catch (e) {
      demoNote.style.display = 'block';
      Widgets.toast(Widgets.escapeHTML(e.message || t('toasts.error')), 'error');
    } finally {
      setBusy(false);
    }
  }

  document.getElementById('btn-accept').addEventListener('click', async function () {
    const ok = await Widgets.confirm(t('offerResp.accept'));
    if (!ok) return;
    respond('accepted');
  });
  document.getElementById('btn-refuse').addEventListener('click', async function () {
    const ok = await Widgets.confirm(t('offerResp.refuse'));
    if (!ok) return;
    respond('refused');
  });
  document.getElementById('btn-negotiate').addEventListener('click', function () {
    negotiateForm.style.display = negotiateForm.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('btn-negotiate-send').addEventListener('click', function () {
    respond('negotiating', {
      salary: document.getElementById('n-salary').value.trim() || null,
      start_date: document.getElementById('n-start').value || null,
      message: document.getElementById('n-message').value.trim() || null
    });
  });
})();
</script>
</body>
</html>
