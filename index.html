<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='57' fill='%230a1122'/%3E%3Ccircle cx='60' cy='60' r='57' fill='none' stroke='%234ECCEC' stroke-opacity='.45' stroke-width='2'/%3E%3Ccircle cx='47' cy='43' r='14' fill='%234ECCEC'/%3E%3Cpath d='M27 86 C29 66, 38 60, 47 60 L68 60 C78 60, 86 72, 88 86 Z' fill='%23e6edf7'/%3E%3Ccircle cx='92' cy='26' r='4' fill='%2323E294'/%3E%3Ccircle cx='85' cy='40' r='3.5' fill='%234ECCEC'/%3E%3Ccircle cx='80' cy='16' r='3' fill='%234ECCEC'/%3E%3Ccircle cx='95' cy='44' r='2.6' fill='%2323E294'/%3E%3Ccircle cx='74' cy='52' r='2.4' fill='%2323E294'/%3E%3Ccircle cx='89' cy='58' r='2.2' fill='%234ECCEC'/%3E%3C/svg%3E">
<style>
.splash-spinner {
  width: 36px;
  height: 36px;
  margin-top: 28px;
  border: 3px solid rgba(255, 255, 255, .3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: splash-spin .8s linear infinite;
}
@keyframes splash-spin {
  to { transform: rotate(360deg); }
}
.splash-status {
  margin-top: 12px;
  font-size: 14px;
  color: rgba(255, 255, 255, .9);
}
.splash-footer {
  position: absolute;
  bottom: 18px;
  left: 0;
  right: 0;
  font-size: 12px;
  color: rgba(255, 255, 255, .7);
}
</style>
<script src="js/ui-mode.js?v=20260809"></script>
</head>
<body data-page="splash">

<div class="splash-screen">
  <select class="lang-switch" id="splash-lang" data-lang-switch></select>

  <div class="splash-logo"><span class="logo-slot" data-logo-slot data-animated="true"></span></div>
  <h1 class="splash-name">TalentFlow</h1>
  <p class="splash-tagline" data-i18n="splash.subtitle"></p>

  <div class="mt-16">
    <button type="button" class="btn btn-primary btn-lg" id="splash-enter" data-i18n="splash.start"></button>
  </div>

  <div class="splash-spinner d-none" id="splash-spinner"></div>
  <div class="splash-status d-none" id="splash-status" data-i18n="splash.loading"></div>

  <footer class="splash-footer">TalentFlow &copy; 2026 &mdash; <span data-i18n="footer.rights"></span></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/ai.js"></script>
<script src="js/widgets.js"></script>
<script src="js/script.js"></script>
<script src="js/animations.js"></script>
<script>
window.pageInit = async function () {
  if (window.TFAnim) TFAnim.play('splash');
  var langSelect = document.getElementById('splash-lang');
  if (langSelect) langSelect.setAttribute('aria-label', typeof t === 'function' ? t('lang.label') : 'Langue');

  var spinner = document.getElementById('splash-spinner');
  var status = document.getElementById('splash-status');
  var enter = document.getElementById('splash-enter');

  enter.addEventListener('click', function () {
    window.location.href = 'login.html';
  });

  setTimeout(async function () {
    spinner.classList.remove('d-none');
    status.classList.remove('d-none');
    try {
      var auth = await Auth.init();
      if (auth && auth.user) {
        var profile = null;
        try {
          profile = await Auth.getProfile();
        } catch (e) {
          profile = null;
        }
        Auth.redirectByRole(profile || { role: 'candidate' });
        return;
      }
    } catch (err) {
      console.warn('[TalentFlow] splash init', err);
    }
    spinner.classList.add('d-none');
    status.classList.add('d-none');
  }, 900);
};
</script>
<script src="js/theme.js?v=20260809"></script>
</body>
</html>
